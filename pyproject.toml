[project]
name = "gurobimcp"
version = "0.1.0"
description = "Gurobi MCP Multi-User Backend — a FastAPI proxy to per-user gurobi/mcp containers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.2",
    "docker>=7.1",
    "passlib[bcrypt]>=1.7",
    "cryptography>=43",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gurobimcp"]

# --- Linting / formatting (T003) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

# --- Type checking, strict (T003) ---
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["gurobimcp"]

# --- Tests (T004) ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker + Intelligence Hub credentials (run with -m integration)",
]
